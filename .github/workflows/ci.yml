name: CI

# Build + test on every push to main and every PR.
#
# Third-party actions are pinned to commit SHAs (comment records the exact
# release each SHA was resolved from). Keep it that way: tags can be re-pointed,
# SHAs cannot.
#
# Record the patch version, not the moving major. These were first resolved from
# `v4` in August 2026, and a comment reading `# v4` gave no way to see that
# checkout and setup-node had since gone to v7 and that every run was warning
# "Node.js 20 is deprecated ... forced to run on Node.js 24". A pin is only as
# good as the reader's ability to tell how stale it is.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every commit must be attributable to a person who can license it under
  # Apache-2.0. Eight commits authored *and* committed by an agent reached main
  # through merged PRs before anyone noticed, and unpicking them cost a history
  # rewrite — which stops being available the moment this repo is public and
  # people have clones. So the guard has to be prevention, here, on the PR.
  #
  # .githooks/commit-msg cannot do this: it is passed the message file and
  # nothing else, so the author and committer fields are invisible to it. That
  # is exactly how these got through.
  #
  # A denylist, not an allowlist: contributors are an open set and their own
  # identities are the record of their licence grant under Apache-2.0 s5.
  # Never normalize a contributor's identity — only reject an agent's.
  authorship:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the PR's commits, not just the merge result. 0 = full history;
          # a shallow clone cannot see the range below.
          fetch-depth: 0

      - name: Reject agent-authored commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Match on the email, never the display name. "Claude" is an ordinary
          # French given name, and a rule that rejects a contributor called
          # Claude Dupont is worse than the one it is guarding against. The
          # email is the identity; the name is just text.
          #
          # %ae/%ce, not %aE/%cE: the raw fields, so a .mailmap can never
          # launder a bad identity into a passing check.
          bad=$(git log --format='%H|%an <%ae>|%cn <%ce>' "$BASE..$HEAD" \
            | awk -F'|' '
                { ids = $2 "\n" $3 }
                tolower(ids) ~ /@anthropic\.com|@openai\.com|noreply@(anthropic|openai)|\[bot\]@|@users\.noreply\.github\.com>.*\[bot\]/ { print }
              ' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits are authored or committed by an agent identity."
            printf '%s\n' "$bad"
            echo
            echo "Every commit must be attributable to a person who can license it"
            echo "under Apache-2.0. Reattribute the range and force-push:"
            echo "  git rebase -x 'git commit --amend --no-edit --reset-author' $BASE"
            exit 1
          fi
          echo "All commits carry a human author and committer."

  # agency-core is platform-neutral, so the cheap Linux runner covers it.
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting (workspace)
        run: cargo fmt --check --all

      - name: Test agency-core
        run: cargo test -p agency-core --locked

  # The Tauri shell compiles on Linux (AGE-218, verified 2026-09-08).
  #
  # `agency-core` has been green on ubuntu since this workflow existed, so the
  # PTY daemon, the Unix-socket protocol, git, worktrees and merge were already
  # Linux-clean. Nobody had tried `agency-app`, and the assumption that it is
  # macOS-only turned out to be wrong: every macOS module already carries a
  # `cfg(not(target_os = "macos"))` arm and the objc2 stack is already scoped
  # under a macOS-only target table, so the crate needed no source changes at
  # all. It needed exactly one dependency change — see the `rfd` comment in
  # crates/agency-app/Cargo.toml, which is a build-script abort you hit before
  # a line of our code is reached, and which is why this went untested for so
  # long: the first attempt looks like "Linux is broken" rather than "one
  # feature flag collides".
  #
  # Green on an x86_64 runner as of PR #1, so this blocks like any other job
  # rather than reporting for information. Promote it to a full build (and to
  # `cargo test`) when the Linux packaging work lands.
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri 2's Linux backend is webkit2gtk 4.1; the appindicator package is
      # what the tray needs, and its absence is a link error rather than a
      # missing-feature warning.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev pkg-config

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Same reason as the macOS job: tauri-build wants frontendDist to exist.
      - name: Build frontend
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Check agency-app
        run: cargo check -p agency-app --locked

  # The Tauri shell only compiles against macOS frameworks.
  app:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # tauri-build wants the frontendDist directory to exist, so build the UI
      # first; build.rs stages a placeholder agency-termd sidecar on its own.
      - name: Build frontend
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      # The placeholder sidecar above satisfies the bundler, but it is not a
      # working daemon, and every AppState::new spawns one for real. Without
      # this step the integration tests all die with "daemon did not come up",
      # which is what the first CI run on this workflow did. `dev.sh` builds it
      # first for the same reason.
      #
      # target/debug/agency-termd is where termd_bin() looks: test executables
      # live in target/debug/deps/, and it checks one level up.
      - name: Build the terminal daemon
        run: cargo build -p agency-core --bin agency-termd --locked

      - name: Test agency-app
        run: cargo test -p agency-app --locked

      # THIRD-PARTY.md reproduces the licence of every crate and package the
      # .app ships, which MIT and Apache-2.0 s4(a) both require of a binary
      # distribution. Nothing about a `cargo add` or a `pnpm add` reminds anyone
      # to regenerate it, and a notices file that has quietly fallen behind the
      # dependency tree is worse than none: it is a claim, and it is wrong. This
      # is the only job with both toolchains and both dependency trees resolved,
      # so it is the only one that can check.
      - name: Check third-party notices are current
        run: python3 scripts/third-party.py --check

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir ui exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir ui test

      - name: Production build
        run: pnpm --dir ui exec vite build
