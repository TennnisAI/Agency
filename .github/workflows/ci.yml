name: CI

# Build + test on every push to main and every PR.
#
# Third-party actions are pinned to commit SHAs (comment records the moving
# tag each SHA was resolved from). Keep it that way: tags can be re-pointed,
# SHAs cannot.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # agency-core is platform-neutral, so the cheap Linux runner covers it.
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting (workspace)
        run: cargo fmt --check --all

      - name: Test agency-core
        run: cargo test -p agency-core --locked

  # The Tauri shell only compiles against macOS frameworks.
  app:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # tauri-build wants the frontendDist directory to exist, so build the UI
      # first; build.rs stages a placeholder agency-termd sidecar on its own.
      - name: Build frontend
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Test agency-app
        run: cargo test -p agency-app --locked

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir ui exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir ui test

      - name: Production build
        run: pnpm --dir ui exec vite build
