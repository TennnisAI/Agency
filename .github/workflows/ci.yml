name: CI

# Build + test on every push to main and every PR.
#
# Third-party actions are pinned to commit SHAs (comment records the moving
# tag each SHA was resolved from). Keep it that way: tags can be re-pointed,
# SHAs cannot.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every commit must be attributable to a person who can license it under
  # Apache-2.0. Eight commits authored *and* committed by an agent reached main
  # through merged PRs before anyone noticed, and unpicking them cost a history
  # rewrite — which stops being available the moment this repo is public and
  # people have clones. So the guard has to be prevention, here, on the PR.
  #
  # .githooks/commit-msg cannot do this: it is passed the message file and
  # nothing else, so the author and committer fields are invisible to it. That
  # is exactly how these got through.
  #
  # A denylist, not an allowlist: contributors are an open set and their own
  # identities are the record of their licence grant under Apache-2.0 s5.
  # Never normalize a contributor's identity — only reject an agent's.
  authorship:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Need the PR's commits, not just the merge result. 0 = full history;
          # a shallow clone cannot see the range below.
          fetch-depth: 0

      - name: Reject agent-authored commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Match on the email, never the display name. "Claude" is an ordinary
          # French given name, and a rule that rejects a contributor called
          # Claude Dupont is worse than the one it is guarding against. The
          # email is the identity; the name is just text.
          #
          # %ae/%ce, not %aE/%cE: the raw fields, so a .mailmap can never
          # launder a bad identity into a passing check.
          bad=$(git log --format='%H|%an <%ae>|%cn <%ce>' "$BASE..$HEAD" \
            | awk -F'|' '
                { ids = $2 "\n" $3 }
                tolower(ids) ~ /@anthropic\.com|@openai\.com|noreply@(anthropic|openai)|\[bot\]@|@users\.noreply\.github\.com>.*\[bot\]/ { print }
              ' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits are authored or committed by an agent identity."
            printf '%s\n' "$bad"
            echo
            echo "Every commit must be attributable to a person who can license it"
            echo "under Apache-2.0. Reattribute the range and force-push:"
            echo "  git rebase -x 'git commit --amend --no-edit --reset-author' $BASE"
            exit 1
          fi
          echo "All commits carry a human author and committer."

  # agency-core is platform-neutral, so the cheap Linux runner covers it.
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting (workspace)
        run: cargo fmt --check --all

      - name: Test agency-core
        run: cargo test -p agency-core --locked

  # The Tauri shell only compiles against macOS frameworks.
  app:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # tauri-build wants the frontendDist directory to exist, so build the UI
      # first; build.rs stages a placeholder agency-termd sidecar on its own.
      - name: Build frontend
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      # The placeholder sidecar above satisfies the bundler, but it is not a
      # working daemon, and every AppState::new spawns one for real. Without
      # this step the integration tests all die with "daemon did not come up",
      # which is what the first CI run on this workflow did. `dev.sh` builds it
      # first for the same reason.
      #
      # target/debug/agency-termd is where termd_bin() looks: test executables
      # live in target/debug/deps/, and it checks one level up.
      - name: Build the terminal daemon
        run: cargo build -p agency-core --bin agency-termd --locked

      - name: Test agency-app
        run: cargo test -p agency-app --locked

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir ui exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir ui test

      - name: Production build
        run: pnpm --dir ui exec vite build
