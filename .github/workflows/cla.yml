name: CLA

# Blocks a pull request until its author has signed CLA.md.
#
# Why a CLA and not just Apache-2.0 section 5: section 5 already licenses every
# contribution to the project inbound, so the project can ship contributed code
# forever without any of this. What it does not give is the right to *sublicense*
# it, so without a CLA the licence of every contributed line is fixed at
# Apache-2.0 permanently, and dual-licensing or a later licence change becomes
# impossible without tracking down every past contributor. Collecting signatures
# from contributor one costs nothing; collecting them from contributor thirty
# means thirty emails and no leverage.
#
# Signatures are stored in this repository, on a dedicated `cla-signatures`
# branch, not on a third-party service. That branch must exist before the first
# pull request arrives:
#
#   git checkout --orphan cla-signatures
#   git rm -rf . && mkdir -p signatures/version1
#   echo '{"signedContributors":[]}' > signatures/version1/cla.json
#   git add -A && git commit -m "Start the CLA signature record"
#   git push -u origin cla-signatures && git checkout main
#
# A dedicated branch, rather than main, because the action commits each
# signature as github-actions[bot]. On main those would accumulate as bot-
# authored commits in the history the `authorship` job in ci.yml exists to keep
# human.

on:
  issue_comment:
    types: [created]
  # pull_request_target, not pull_request: the job needs write access to comment
  # on the PR, set its status, and commit the signature, and a fork-originated
  # `pull_request` run gets a read-only token. The usual danger of
  # pull_request_target is that it runs with the base repo's permissions while
  # the workflow checks out untrusted PR code. This one never checks anything
  # out. Do not add actions/checkout here.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the signature
        if: |
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        # Pinned to a commit SHA, as every third-party action here is: this one
        # runs with contents:write on a public repo, so a re-pointed tag would
        # be a write-access handover.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/TennnisAI/Agency/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # The maintainer's own account, and bots, which cannot sign anything.
          allowlist: nic123,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            [CLA.md](https://github.com/TennnisAI/Agency/blob/main/CLA.md) and
            sign it by posting a comment on this pull request with exactly the
            sentence below. Signing once covers all your future contributions.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
