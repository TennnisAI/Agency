name: Linux packages

# Build the .deb, .rpm and AppImage for both architectures on native runners,
# and upload them as artifacts.
#
# This exists because the local path cannot practically do x86_64. Tauri links
# against the host's webkit2gtk and cannot cross-compile, so on an Apple Silicon
# Mac `scripts/release-linux.sh --arch amd64` runs a full release build under
# qemu, which is slow enough to be impractical. GitHub's ubuntu runners are
# natively x86_64 and its arm runners natively aarch64, so each matrix leg
# builds at full speed on real hardware.
#
# Pinned to 22.04, not ubuntu-latest, and this is the whole ballgame for
# distribution: a Linux binary runs on any glibc at least as new as the one it
# was linked against, and on no glibc older. `ubuntu-latest` is 24.04 (glibc
# 2.39), and a package built there installs cleanly on Debian 12 and then dies
# on launch with "version `GLIBC_2.39' not found" — observed, not theorised.
# 22.04 is glibc 2.35, which covers Ubuntu 22.04 LTS and 24.04, Debian 12 and
# 13, and current Fedora. AppImages do not rescue you here: they bundle
# libraries but never libc. Raise this only when dropping those distros is a
# decision someone has actually made.
#
# Manual trigger: the packages are not signed and this is not the release
# mechanism, it is "give me something to install and try".

on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Formats to build (comma separated: deb,rpm,appimage)"
        required: false
        default: "deb,rpm,appimage"
  # Also on a PR that touches the packaging itself. Two reasons. It is the only
  # way to get artifacts before this file reaches the default branch, since
  # workflow_dispatch refuses to run a workflow main has never seen ("not found
  # on the default branch"). And it is worth keeping afterwards: a change to the
  # bundler config or the build script is exactly when a package quietly stops
  # being installable, and the path filter keeps it off every other PR.
  pull_request:
    paths:
      - ".github/workflows/linux-packages.yml"
      - "scripts/release-linux.sh"
      - "crates/agency-app/tauri.conf.json"
      - "crates/agency-app/build-termd.sh"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirrors the container prelude in scripts/release-linux.sh. xdg-utils is
      # not a build dependency: the AppImage bundler copies /usr/bin/xdg-open
      # into the image because tauri-plugin-opener shells out to it at runtime.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev pkg-config file desktop-file-utils \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Keyed by runner image, not just by OS. rust-cache's default key covers
      # `runner.os` ("Linux") and the rustc version, neither of which
      # distinguishes ubuntu-24.04 from ubuntu-22.04. Moving this matrix from
      # ubuntu-latest to 22.04 therefore restored a target/ built on 24.04, and
      # the build died with five "can't find crate for `tauri`" errors and no
      # upstream failure to explain them.
      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.runner }}

      # The same script the maintainer runs locally, on its native-Linux path,
      # so CI and a local build cannot drift into producing different packages.
      - name: Build packages
        env:
          # `inputs` only exists for workflow_dispatch, so on the pull_request
          # trigger this is empty and the script is handed `--bundles ""`,
          # which it rejects. The fallback belongs here rather than in the
          # script: an empty --bundles is a caller mistake worth reporting.
          BUNDLES: ${{ inputs.bundles || 'deb,rpm,appimage' }}
        run: ./scripts/release-linux.sh --native --bundles "$BUNDLES"

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
