name: Release

# Cuts a release: a signed + notarized Agency DMG and the Linux packages, all
# attached to one draft GitHub Release.
#
# Trigger by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# or run manually from the Actions tab (workflow_dispatch).
#
# Signing/notarization is handled natively by `cargo tauri build`: when the
# APPLE_* env vars below are present, Tauri imports the cert into a temporary
# keychain, deep-signs the bundle (including the agency-termd sidecar), then
# notarizes and staples the DMG. This mirrors scripts/release-macos.sh, except
# the cert comes from a secret and notarization uses an app-specific password
# instead of a local keychain profile.
#
# The Linux packages come from linux-packages.yml, called rather than copied,
# so a release ships exactly what that workflow builds and verifies on a PR.
#
# Neither build job touches the release. Each uploads an artifact, and the
# publish job creates the draft once both have passed. When the DMG job created
# the release itself, adding a second platform would have meant a release that
# goes out with half its downloads whenever one leg fails; the site links every
# one of them by name, so a missing .deb is a broken button, not a gap.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_CERTIFICATE           base64 of the exported Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD  password used when exporting the .p12
#   APPLE_SIGNING_IDENTITY      Developer ID Application: Nicholas Counts (9XD5R448N5)
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               9XD5R448N5

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon runner -> aarch64 build
    steps:
      # Third-party actions are pinned to commit SHAs (comment records the
      # moving tag each SHA was resolved from). This workflow handles the
      # Apple signing certificate and notary credentials, so a re-pointed
      # action tag must never be able to change what runs here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install tauri-cli
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: tauri-cli

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build agency-termd sidecar
        run: ./crates/agency-app/build-termd.sh

      # The bundler only checks for the sidecar after a full release compile, so
      # a triple mismatch costs six minutes before it says anything. Assert the
      # exact path the next step will ask for, while it is still cheap to fix.
      - name: Check the sidecar is where the bundler will look
        run: |
          want="target/release/agency-termd-aarch64-apple-darwin"
          if [ ! -x "$want" ]; then
            echo "::error::missing $want; build-termd.sh produced:"
            ls -l target/release/agency-termd* || true
            exit 1
          fi
          file "$want"

      - name: Build, sign, and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --target is not optional here, and not merely belt-and-braces. Tauri
        # reads the sidecar's triple suffix off the CLI binary's own
        # architecture, not off the Rust toolchain, and taiki-e/install-action
        # fetched tauri-cli 2.11.4 as x86_64-apple-darwin on this ARM64 runner.
        # Under Rosetta it demanded agency-termd-x86_64-apple-darwin while
        # build-termd.sh had correctly built -aarch64-apple-darwin from the
        # aarch64 host, and the bundle step died after a 5m39s release compile.
        # Naming the target makes the triple a stated fact rather than a
        # consequence of which prebuilt CLI the installer happened to pick.
        run: cargo tauri build --target aarch64-apple-darwin

      # Tauri notarizes and staples the .app, then builds the DMG around it and
      # only signs the DMG; it never submits the disk image. So the DMG people
      # download carried no ticket of its own, and download.html promises one
      # ("signed and notarized by Apple, so it opens without a Gatekeeper
      # prompt"). Submitting it here is what makes that sentence true. The app
      # inside is already stapled, which Apple is fine with and which is why
      # this second pass is quick.
      - name: Notarize and staple the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          dmg="$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n1)"
          echo "DMG: $dmg"
          out="$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            # A rejection says only "Invalid" without --wait output; the log has
            # the actual reason, and it is the only thing worth reading here.
            id="$(printf '%s' "$out" | awk '/^ *id: /{print $2; exit}')"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            fi
            exit "$rc"
          fi
          xcrun stapler staple "$dmg"

      - name: Verify both tickets are stapled
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Agency.app"
          dmg="$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n1)"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          # Gatekeeper's own verdict, which is the one the user's machine gives.
          spctl --assess --verbose=4 --type execute "$app"

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-macos
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    uses: ./.github/workflows/linux-packages.yml

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the packages
    steps:
      # Every artifact into one tree. The Linux ones keep the bundler's
      # deb/, rpm/ and appimage/ folders, and the two architectures merge
      # into each: their filenames differ by arch, so nothing collides.
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agency-*
          path: dist
          merge-multiple: true

      - name: List what will be attached
        run: find dist -type f -exec ls -l {} \;

      - name: Publish draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: Agency ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/deb/*.deb
            dist/rpm/*.rpm
            dist/appimage/*.AppImage
          fail_on_unmatched_files: true
