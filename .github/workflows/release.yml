name: Release (macOS)

# Cuts a signed + notarized Agency DMG and attaches it to a draft GitHub Release.
#
# Trigger by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# or run manually from the Actions tab (workflow_dispatch).
#
# Signing/notarization is handled natively by `cargo tauri build`: when the
# APPLE_* env vars below are present, Tauri imports the cert into a temporary
# keychain, deep-signs the bundle (including the agency-termd sidecar), then
# notarizes and staples the DMG. This mirrors scripts/release-macos.sh, except
# the cert comes from a secret and notarization uses an app-specific password
# instead of a local keychain profile.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_CERTIFICATE           base64 of the exported Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD  password used when exporting the .p12
#   APPLE_SIGNING_IDENTITY      Developer ID Application: Nicholas Counts (9XD5R448N5)
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               9XD5R448N5

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-macos:
    runs-on: macos-14 # Apple Silicon runner -> aarch64 build
    permissions:
      contents: write # create the release and upload the DMG
    steps:
      # Third-party actions are pinned to commit SHAs (comment records the
      # moving tag each SHA was resolved from). This workflow handles the
      # Apple signing certificate and notary credentials, so a re-pointed
      # action tag must never be able to change what runs here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install tauri-cli
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: tauri-cli

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build agency-termd sidecar
        run: ./crates/agency-app/build-termd.sh

      - name: Build, sign, and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build

      - name: Verify notarization ticket is stapled
        run: |
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n1)"
          echo "DMG: $dmg"
          xcrun stapler validate "$dmg"

      - name: Publish draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: Agency ${{ github.ref_name }}
          files: target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
