[package]
name = "agency-app"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Tauri app shell for Agency"
repository = "https://github.com/TennnisAI/Agency"
homepage = "https://getagency.dev/"
# The .deb's Maintainer field is this list, and Debian wants "Name <email>" in
# it. Without it the bundler falls back to the publisher, and without that to
# the first word of the identifier, which is how the first package shipped as
# "Maintainer: agency": lintian calls it malformed-contact, and a software
# centre shows a package with no contact as exactly what it looks like. The
# address is the one SECURITY.md already publishes.
authors = ["Nicholas Counts <hello@tennnis.no>"]

[lib]
name = "agency_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Name the binary "Agency" so macOS shows "Agency" (not "agency-app") in the
# dock/taskbar hover during `tauri dev`. Bundled builds already use productName.
[[bin]]
name = "Agency"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Direct dep on the dialog backend tauri-plugin-dialog already uses: its sync
# dialogs work before/without the Tauri event loop, which the plugin's
# blocking_show (main-thread dispatch) does not — needed for the startup
# failure dialog shown from setup().
# `default-features = false`: rfd's defaults turn on `xdg-portal`, while
# tauri-plugin-dialog's defaults turn on `gtk3`, and rfd's build script
# refuses both at once ("You can't enable both `gtk3` and `xdg-portal`
# features at once") — so on Linux the two together fail to build before
# reaching a line of our code. The only use here is one synchronous
# MessageDialog (`lib.rs`, the setup-failure fallback), which needs none of
# the defaults, so dropping them leaves gtk3 as the single backend.
rfd = { version = "0.16", default-features = false }
# Direct dep on the same backend tauri-plugin-notification uses, only to call
# set_application() on macOS so notifications carry the Agency icon.
notify-rust = "4"
agency-core = { path = "../agency-core" }
log = "0.4"
uuid = { version = "1", features = ["v4"] }

# Reading the whole macOS pasteboard (every item, not just the first, which is
# all WebKit's paste gives the webview — see clipboard.rs). Same objc2 stack
# tauri/wry already build against.
[target.'cfg(target_os = "macos")'.dependencies]
# NSImage/NSBitmapImageRep encode the preview screenshot (preview_shot.rs).
# NSMenu/NSMenuItem are the WebKit context menu the app filters
# (webview_menu.rs); the identifier it filters on comes from the
# NSUserInterfaceItemIdentification protocol. NSRunningApplication answers
# whether Agency is frontmost, which the webview's focus bit only approximates
# (foreground.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSMenu", "NSMenuItem", "NSRunningApplication", "NSUserInterfaceItemIdentification"] }
# Named explicitly (not left to feature unification with tauri's own objc2 use):
# iterating the pasteboard's NSArray needs NSEnumerator, and dropping it turns
# into a type error here rather than anywhere near the code that wants it.
# NSData/NSDictionary/NSError and the CGRect geometry back preview_shot.rs.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSData", "NSDictionary", "NSError", "NSGeometry"] }
# takeSnapshot on the window's own WKWebView — the same objc2/wry stack again.
# "block2" gates the completion-handler methods.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
# CGRect and friends for the snapshot crop; the CG types moved here in the
# objc2 0.3 framework split (wry imports them from the same place).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2 = "0.6"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
