[package]
name = "agency-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "agency_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Name the binary "Agency" so macOS shows "Agency" (not "agency-app") in the
# dock/taskbar hover during `tauri dev`. Bundled builds already use productName.
[[bin]]
name = "Agency"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Direct dep on the dialog backend tauri-plugin-dialog already uses: its sync
# dialogs work before/without the Tauri event loop, which the plugin's
# blocking_show (main-thread dispatch) does not — needed for the startup
# failure dialog shown from setup().
rfd = "0.16"
# Direct dep on the same backend tauri-plugin-notification uses, only to call
# set_application() on macOS so notifications carry the Agency icon.
notify-rust = "4"
agency-core = { path = "../agency-core" }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
