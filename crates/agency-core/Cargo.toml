[package]
name = "agency-core"
version = "0.1.0"
edition = "2021"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
daemonize = "0.5"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
trash = "5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
