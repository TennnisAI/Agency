[package]
name = "agency-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Core library and agency-termd terminal daemon for Agency"
repository = "https://github.com/nic123/Agency"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
daemonize = "0.5"
globset = "0.4"
log = "0.4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
trash = "5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
